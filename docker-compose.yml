# Platedex: https://github.com/sudorm-rfslash/platedex
# Set PUBLIC_URL and SECRET_KEY below. All settings: README → Configuration.
# Apply changes with `docker compose up -d`.
services:
  platedex:
    image: ghcr.io/sudorm-rfslash/platedex:latest
    container_name: platedex
    restart: unless-stopped
    environment:
      # Required
      PUBLIC_URL: https://platedex.example.com  # address people open; HTTPS for phone camera/location
      SECRET_KEY: change-me                     # generate with: openssl rand -hex 32
      # Optional AI reader: your Ollama, e.g. http://ollama:11434. Empty = OCR only.
      OLLAMA_URL: ""
      # Setting these locks them in More → Admin. Delete a line to manage it in the panel.
      LOCAL_LOGIN_ENABLED: "true"               # username/password sign-in
      OCR_THRESHOLD: "85"                       # confidence % below which a reading goes to Verify
      VLM_MODE: auto                            # AI second opinion: auto, always or off
      MAX_UPLOAD_MB: "25"                       # largest accepted photo
    ports:
      - "8080:8080"
    volumes:
      - platedex-data:/data
      # - ./import:/import   # optional watch folder; also set IMPORT_DIR: /import above

volumes:
  platedex-data:
