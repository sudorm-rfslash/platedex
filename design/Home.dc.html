<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.app{--bg:#F4F5F3;--surface:#FFFFFF;--surface2:#ECEEEB;--ink:#15181C;--muted:#555C64;--line:#D7DBDD;--accent:#1D4ED8;--accent-ink:#FFFFFF;--accent-soft:#E2E9FC;--amber-bg:#FEF3C7;--amber-line:#E9B949;--amber-ink:#6E4300;--ok:#147A39;--ok-soft:#DCF2E3;--bad:#B42318;--badge:#C8291C;--badge-ink:#FFFFFF;--plate-bg:#FFFFFF;--plate-ink:#13204A;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.10);--map-bg:#ECEDE7;--map-major:#E3D2A8;--map-border:#B9BDB6;--dot:#1D4ED8;font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app[data-theme="dark"]{--bg:#0E1012;--surface:#16191C;--surface2:#1F2327;--ink:#ECEEF0;--muted:#A3AAB2;--line:#2C3137;--accent:#82A6FF;--accent-ink:#0A1430;--accent-soft:#1B2747;--amber-bg:#33260B;--amber-line:#6B4E14;--amber-ink:#F4D27E;--ok:#5BD68B;--ok-soft:#13301F;--bad:#FF8A7E;--badge:#FF7A6B;--badge-ink:#240804;--plate-bg:#F2F3EF;--plate-ink:#13204A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);--map-bg:#1C2023;--map-major:#4A4231;--map-border:#454B51;--dot:#82A6FF}
@media (prefers-color-scheme: dark){.app[data-theme="auto"]{--bg:#0E1012;--surface:#16191C;--surface2:#1F2327;--ink:#ECEEF0;--muted:#A3AAB2;--line:#2C3137;--accent:#82A6FF;--accent-ink:#0A1430;--accent-soft:#1B2747;--amber-bg:#33260B;--amber-line:#6B4E14;--amber-ink:#F4D27E;--ok:#5BD68B;--ok-soft:#13301F;--bad:#FF8A7E;--badge:#FF7A6B;--badge-ink:#240804;--plate-bg:#F2F3EF;--plate-ink:#13204A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);--map-bg:#1C2023;--map-major:#4A4231;--map-border:#454B51;--dot:#82A6FF}}
.app *{box-sizing:border-box}
.app a{color:var(--accent)}
.app h1,.app h2,.app h3,.app p{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-feature-settings:"zero" 1;font-variant-numeric:slashed-zero}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:0;background:transparent;color:var(--ink);cursor:pointer;flex:none}
.field{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;width:100%}
.btn:focus-visible,.iconbtn:focus-visible,.field:focus,.app a:focus-visible,.tog:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.plate{display:inline-flex;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:"zero" 1;font-weight:700;letter-spacing:.06em;background:var(--plate-bg);color:var(--plate-ink);border:1.5px solid var(--plate-ink);border-radius:6px;padding:2px 8px;font-size:15px;white-space:nowrap;line-height:1.25}
.plate.partial{border-style:dashed}
.stc{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.partial{background:var(--amber-bg);color:var(--amber-ink);border:1px dashed var(--amber-line)}
.count{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--badge);color:var(--badge-ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ava{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.u-alex{background:#1D4ED8}.u-maya{background:#B4441A}.u-jordan{background:#0F6B63}
.tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding-bottom:20px;flex:none}
.tabbar a{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;position:relative}
.app .tabbar a.on{color:var(--accent)}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 5px)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tog{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tog.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.prow{display:flex;gap:12px;align-items:stretch;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.app a.prow{color:var(--ink)}
.prow:hover{border-color:var(--muted)}
.mini{position:relative;width:80px;height:54px;border-radius:8px;overflow:hidden;flex:none;background:var(--map-bg);border:1px solid var(--line)}
.mini i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--dot);border:1.5px solid var(--surface);transform:translate(-50%,-50%)}
.mm-major{stroke:var(--map-major);fill:none}.mm-border{stroke:var(--map-border);fill:none;stroke-dasharray:3 3}
.scrim{position:absolute;inset:0;background:rgba(10,12,16,.5);border:0;padding:0;cursor:pointer;z-index:10}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);z-index:11;display:flex;flex-direction:column}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop{position:absolute;z-index:12;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:6px}
.ex{display:flex;gap:10px;align-items:center;min-height:44px;padding:4px 8px;border-radius:8px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.ex:hover{background:var(--surface2)}
.ex code{font-family:'JetBrains Mono',monospace;font-feature-settings:"zero" 1;font-weight:800;font-size:14px;min-width:78px;color:var(--accent)}
.fchip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 4px 0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;border:0;font-family:inherit;cursor:pointer}
.missing{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;width:100%;text-align:left}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--accent)}
.ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(160deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center}
.ph .lp{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800;letter-spacing:.08em;background:#F7F7F2;color:#13204A;border:2px solid #13204A;border-radius:5px;padding:3px 8px;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.ph .flag{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--amber-bg);color:var(--amber-ink)}
.ph .pend{position:absolute;inset:auto 8px 8px 8px;text-align:center;font-size:12.5px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;min-width:0}
.cap{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.cap span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 0 2px}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
</style>
</helmet>
<div class="app" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
<header style="padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 10px"><svg width="40" height="26" viewBox="0 0 84 52" aria-hidden="true"><rect x="3" y="3" width="78" height="46" rx="8" fill="none" stroke="currentColor" stroke-width="4.5"></rect><text x="42" y="35" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="800" font-size="21" letter-spacing="3" fill="currentColor">PDX</text></svg><h1 style="font-size: 22px; font-weight: 800; flex: 1">Latest</h1><span class="muted" style="font-size: 13px">{{headline}}</span></div>
<div style="display: flex; gap: 8px">
<label style="flex: 1; min-width: 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Sort</span>
<select class="field" style="font-size: 14px; font-weight: 600" value="{{sort}}" onChange="{{onSort}}"><sc-for list="{{sorts}}" as="o" hint-placeholder-count="4"><option value="{{o.value}}">{{o.label}}</option></sc-for></select></label>
<button class="btn" onClick="{{openSheet}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filter<sc-if value="{{hasSheetCount}}" hint-placeholder-val="{{ false }}"><span class="badge" style="background: var(--accent); color: var(--accent-ink)">{{sheetCount}}</span></sc-if></button>
</div>
<div class="chiprow" role="group" aria-label="Whose photos"><sc-for list="{{who}}" as="w" hint-placeholder-count="4"><button class="chip {{w.cls}}" aria-pressed="{{w.on}}" onClick="{{w.pick}}"><sc-if value="{{w.isUser}}" hint-placeholder-val="{{ false }}"><span class="ava {{w.uCls}}" style="width: 22px; height: 22px; font-size: 10px">{{w.ui}}</span></sc-if>{{w.label}}</button></sc-for></div>
</header>
<div style="flex: 1; overflow-y: auto; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<sc-if value="{{g.hasTitle}}" hint-placeholder-val="{{ true }}"><div class="day"><h2 style="font-size: 16px; font-weight: 800">{{g.title}}</h2><span class="muted" style="font-size: 13px">{{g.count}}</span></div></sc-if>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" class="tile" aria-label="{{it.id}} {{it.cap}}">
<div class="ph" style="--g1: {{it.g1}}; --g2: {{it.g2}}">
<sc-if value="{{it.plate}}" hint-placeholder-val="{{ true }}"><span class="lp">{{it.id}}</span></sc-if>
<sc-if value="{{it.noLoc}}" hint-placeholder-val="{{ false }}"><span class="flag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"></path><path d="M4 4l16 16"></path></svg>No location</span></sc-if>
<sc-if value="{{it.pend}}" hint-placeholder-val="{{ false }}"><span class="pend">{{it.pending}}</span></sc-if>
</div>
<sc-if value="{{it.plate}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; gap: 6px"><span class="plate" style="font-size: 13px">{{it.id}}</span><span class="stc">{{it.st}}</span></div></sc-if>
<div class="cap"><span class="ava {{it.uCls}}" style="width: 20px; height: 20px; font-size: 10px">{{it.ui}}</span><span>{{it.cap}}</span></div>
</a>
</sc-for>
</div>
</sc-for>
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
<div style="padding: 40px 12px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center"><p style="font-weight: 800">Nothing matches</p><p class="muted" style="font-size: 14px">Try another uploader or clear the filters.</p><button class="btn" onClick="{{clearAll}}">Clear filters</button></div>
</sc-if>
</div>
<nav class="tabbar" aria-label="Main">
<a href="Home.dc.html" class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="Upload.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg>Upload</a>
<a href="Review.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M8 12l3 3 5-6"></path></svg>Review<span class="badge" aria-label="15 pending">15</span></a>
<a href="Plates.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"></rect><path d="M6.5 12h3M12 12h5.5"></path></svg>Plates</a>
<a href="Map.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</a>
<a href="More.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>More</a>
</nav>

<sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
<button class="scrim" aria-label="Close filters" onClick="{{closeSheet}}"></button>
<div class="sheet" role="dialog" aria-label="Filters">
<div class="grab"></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 8px 8px 16px"><h2 style="font-size: 18px; font-weight: 800">Filters</h2><button class="iconbtn" aria-label="Close" onClick="{{closeSheet}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div style="flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 18px">
<section style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">Date</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{ranges}}" as="o" hint-placeholder-count="3"><button class="tog {{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></section>
<section style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">State</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{states}}" as="o" hint-placeholder-count="7"><button class="tog {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button></sc-for></div></section>
<section style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">Show only</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><button class="tog {{vanityCls}}" aria-pressed="{{vanity}}" onClick="{{toggleVanity}}">Vanity plates</button><button class="tog {{reviewCls}}" aria-pressed="{{review}}" onClick="{{toggleReview}}">Needs review</button><button class="tog {{missingCls}}" aria-pressed="{{missing}}" onClick="{{toggleMissing}}">Missing location</button></div></section>
</div>
<div style="display: flex; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid var(--line)"><button class="btn" onClick="{{clearFilters}}">Clear all</button><button class="btn primary" style="flex: 1" onClick="{{closeSheet}}">{{showLabel}}</button></div>
</div>
</sc-if>
</div>
</x-dc>

const GRAD = [['#6B7A8F', '#2E3440'], ['#8C7B6B', '#3B3128'], ['#5E7D6A', '#25352C'], ['#7D6B8C', '#2F2838'], ['#8C6B6B', '#3A2626']];
// Photos still waiting in Review show in the feed until someone identifies them.
const PENDING = [['10-09', 'A', 'm', 'Needs review'], ['10-07', '-', 'j', 'No plate found'], ['09-29', 'D', 'a', 'Needs review']];
const ITEMS = [];
RAW.forEach(([id, st, mean, tags, , s], pi) => {
  const all = s.split(',');
  all.forEach((x, k) => {
    const [d, c, u] = x.split(' ');
    const h = ((+d.slice(3) * 7 + k * 5) % 11) + 8, m = (+d.slice(3) * 13) % 60;
    ITEMS.push({ id, st, d, c: c === '-' ? null : c, u: U[u], vanity: !!mean || tags.includes('vanity'), n: all.length,
      min: h * 60 + m, time: (h > 12 ? h - 12 : h) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM'), g: GRAD[(pi + k) % GRAD.length] });
  });
});
PENDING.forEach(([d, c, u, label], k) => ITEMS.push({ id: null, st: null, d, c: c === '-' ? null : c, u: U[u], pending: label, n: 0,
  min: 600 + k * 97, time: (10 + k) + ':' + String(k * 17 % 60).padStart(2, '0') + ' AM', g: GRAD[(k + 2) % GRAD.length] }));
const RANGES = [['all', 'All time'], ['7', 'Last 7 days'], ['30', 'Last 30 days']];
const inRange = (d, r) => r === 'all' ? true : r === '7' ? d >= '10-04' : d >= '09-11';
const SORTS = [['new', 'Newest first'], ['old', 'Oldest first'], ['az', 'Plate A–Z'], ['most', 'Most-seen plates']];
const EMPTY = { who: 'all', range: 'all', states: [], vanity: false, review: false, missing: false };
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sort: 'new', sheet: false, tile: 210, f: { ...EMPTY } }; }
  setF(patch) { this.setState({ f: { ...this.state.f, ...patch } }); }
  renderVals() {
    const s = this.state, f = s.f;
    let items = ITEMS.filter((x) => (f.who === 'all' || (f.who === 'mine' ? x.u === 'alex' : x.u === f.who))
      && inRange(x.d, f.range) && (!f.states.length || f.states.includes(x.st))
      && (!f.vanity || x.vanity) && (!f.review || x.pending) && (!f.missing || !x.c));
    const byDate = s.sort === 'new' || s.sort === 'old';
    const cmp = {
      new: (a, b) => b.d.localeCompare(a.d) || b.min - a.min, old: (a, b) => a.d.localeCompare(b.d) || a.min - b.min,
      az: (a, b) => (a.id || '~').localeCompare(b.id || '~') || b.d.localeCompare(a.d),
      most: (a, b) => b.n - a.n || (a.id || '').localeCompare(b.id || '') || b.d.localeCompare(a.d)
    }[s.sort];
    items = items.slice().sort(cmp).map((x) => ({
      ...x, plate: !!x.id, pend: !!x.pending, noLoc: !x.c, hasN: x.n > 1, nL: x.n + '×',
      g1: x.g[0], g2: x.g[1], uCls: 'u-' + x.u, ui: x.u[0].toUpperCase(),
      href: x.id ? 'Plate.dc.html' : 'Review.dc.html',
      cap: (byDate ? x.time : dl(x.d) + ', ' + x.time) + ' · ' + (x.c ? CITY[x.c].name : 'no location'),
      capDesk: x.u + ' · ' + (byDate ? x.time : dl(x.d) + ', ' + x.time) + ' · ' + (x.c ? CITY[x.c].name : 'no location')
    }));
    const groups = [];
    if (!byDate) groups.push({ title: '', titleDesk: '', count: '', items });
    else for (const it of items) {
      const last = groups[groups.length - 1];
      if (last && last.d === it.d) last.items.push(it);
      else groups.push({ d: it.d, title: DOW[dow(it.d)] + ', ' + dl(it.d), titleDesk: DOWL[dow(it.d)] + ', ' + dl(it.d), items: [it] });
    }
    groups.forEach((g) => { g.count = byDate ? g.items.length + (g.items.length === 1 ? ' photo' : ' photos') : ''; g.hasTitle = byDate; });
    const photos = new Set(items.map((x) => x.d + x.min + x.u)).size;
    const plates = new Set(items.filter((x) => x.id).map((x) => x.id)).size;
    const spotters = new Set(items.map((x) => x.u)).size;
    const sheetCount = (f.range !== 'all' ? 1 : 0) + f.states.length + +f.vanity + +f.review + +f.missing;
    const tgl = (k) => () => this.setF({ [k]: !f[k] });
    const whoOpts = [['all', 'Everyone'], ['mine', 'Mine'], ['maya', 'maya'], ['jordan', 'jordan']];
    return {
      theme: this.props.theme ?? 'auto',
      headline: photos + (photos === 1 ? ' photo' : ' photos'),
      headlineDesk: photos + ' photos · ' + plates + (plates === 1 ? ' plate' : ' plates') + ' · ' + spotters + (spotters === 1 ? ' spotter' : ' spotters'),
      groups, none: items.length === 0, sort: s.sort, sheet: s.sheet,
      sorts: SORTS.map(([value, label]) => ({ value, label })),
      who: whoOpts.map(([k, label]) => ({ label, on: f.who === k, cls: f.who === k ? 'on' : '', isUser: k === 'maya' || k === 'jordan', uCls: 'u-' + k, ui: k[0].toUpperCase(), pick: () => this.setF({ who: k }) })),
      ranges: RANGES.map(([k, label]) => ({ label, value: k, cls: f.range === k ? 'on' : '', pick: () => this.setF({ range: k }) })),
      range: f.range,
      stateVal: f.states[0] || '',
      states: ['AZ', 'CA', 'CO', 'NM', 'NY', 'TX', 'WA'].map((v) => ({ label: v, on: f.states.includes(v), cls: f.states.includes(v) ? 'on' : '', pick: () => this.setF({ states: f.states.includes(v) ? f.states.filter((x) => x !== v) : f.states.concat([v]) }) })),
      vanityCls: f.vanity ? 'on' : '', reviewCls: f.review ? 'on' : '', missingCls: f.missing ? 'on' : '',
      vanity: f.vanity, review: f.review, missing: f.missing,
      hasSheetCount: sheetCount > 0, sheetCount,
      showLabel: 'Show ' + photos + (photos === 1 ? ' photo' : ' photos'),
      tile: s.tile, tileCols: 'repeat(auto-fill, minmax(' + s.tile + 'px, 1fr))',
      onSort: (e) => this.setState({ sort: e.target.value }),
      onRange: (e) => this.setF({ range: e.target.value }),
      onState: (e) => this.setF({ states: e.target.value ? [e.target.value] : [] }),
      onTile: (e) => this.setState({ tile: +e.target.value }),
      toggleVanity: tgl('vanity'), toggleReview: tgl('review'), toggleMissing: tgl('missing'),
      openSheet: () => this.setState({ sheet: true }), closeSheet: () => this.setState({ sheet: false }),
      clearFilters: () => this.setState({ f: { ...EMPTY, who: f.who } }),
      clearAll: () => this.setState({ f: { ...EMPTY } })
    };
  }
}
</script>
